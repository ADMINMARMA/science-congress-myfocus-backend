name: Test and deploy backend to Jino

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-science-congress-myfocus-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      BACKEND_UPLOAD_EXCLUDE: |
        **/.git*
        **/.git*/**
        **/node_modules/**
        tmp
        tmp/**
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build deployable backend
        run: npm run build
      - name: Deploy to Jino over FTPS
        id: deploy_first
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          # Use the FTP host shown in this Jino account's file-access settings.
          server: j59536815.myjino.ru
          username: ${{ secrets.JINO_FTP_USER }}
          password: ${{ secrets.JINO_FTP_PASSWORD }}
          protocol: ftps
          timeout: 60000
          local-dir: ./dist/
          # This FTP account is rooted at /domains/_projects on Jino.
          server-dir: /science-congress-myfocus-backend.marma.pro/
          exclude: ${{ env.BACKEND_UPLOAD_EXCLUDE }}
      - name: Retry Jino FTPS deployment
        id: deploy_second
        if: steps.deploy_first.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: j59536815.myjino.ru
          username: ${{ secrets.JINO_FTP_USER }}
          password: ${{ secrets.JINO_FTP_PASSWORD }}
          protocol: ftps
          timeout: 60000
          local-dir: ./dist/
          server-dir: /science-congress-myfocus-backend.marma.pro/
          exclude: ${{ env.BACKEND_UPLOAD_EXCLUDE }}
      - name: Final Jino FTPS attempt
        id: deploy_third
        if: steps.deploy_first.outcome == 'failure' && steps.deploy_second.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: j59536815.myjino.ru
          username: ${{ secrets.JINO_FTP_USER }}
          password: ${{ secrets.JINO_FTP_PASSWORD }}
          protocol: ftps
          timeout: 60000
          local-dir: ./dist/
          server-dir: /science-congress-myfocus-backend.marma.pro/
          exclude: ${{ env.BACKEND_UPLOAD_EXCLUDE }}
      - name: Confirm backend deployment
        if: always()
        shell: bash
        run: |
          test "${{ steps.deploy_first.outcome }}" = success ||
          test "${{ steps.deploy_second.outcome }}" = success ||
          test "${{ steps.deploy_third.outcome }}" = success
      - name: Prepare Passenger restart after the backend upload
        run: >-
          node --input-type=module -e "import { mkdir, writeFile } from 'node:fs/promises';
          await mkdir('dist/tmp', { recursive: true });
          await writeFile('dist/tmp/restart.txt', new Date().toISOString() + '\n');"
      - name: Restart the Jino backend over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: j59536815.myjino.ru
          username: ${{ secrets.JINO_FTP_USER }}
          password: ${{ secrets.JINO_FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          local-dir: ./dist/tmp/
          server-dir: /science-congress-myfocus-backend.marma.pro/tmp/
      - name: Verify the restarted backend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as delay } from 'node:timers/promises';
          const backend = 'https://science-congress-myfocus-backend.marma.pro';
          const origins = [
            'https://science-congress-myfocus-app.marma.pro',
            'https://science-congress-myfocus-test.marma.pro',
            'https://science-congress-myfocus.marma.pro',
          ];
          async function check(path, type, statuses, origin) {
            const response = await fetch(backend + path, {
              signal: AbortSignal.timeout(5000),
              headers: { 'Cache-Control': 'no-cache', ...(origin ? { Origin: origin } : {}) },
            });
            await response.body?.cancel();
            return statuses.includes(response.status) &&
              response.headers.get('Content-Type')?.includes(type) &&
              (!origin || response.headers.get('Access-Control-Allow-Origin') === origin);
          }
          for (let attempt = 0; attempt < 12; attempt++) {
            const probes = [check('/health', 'application/json', [200]), check('/table', 'application/json', [200]),
              ...origins.map((origin) => check('/expoforum-stands', 'application/json', [200, 503], origin))];
            if ((await Promise.all(probes).catch(() => [])).filter(Boolean).length === probes.length) {
              console.log('Verified the legacy table and ExpoForum stand endpoints on Jino.');
              process.exit(0);
            }
            if (attempt < 11) await delay(5000);
          }
          throw new Error('The Jino backend did not pick up the deployed endpoint or its CORS settings.');
          NODE
